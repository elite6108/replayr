# Build Replayr macOS DMG only. Does not run Windows NSIS builds.
# Publishes https://github.com/elite6108/replayr/releases/download/macos/Replayr.dmg
# so the website can 302 /releases/Replayr.dmg without embedding the binary in Workers Assets.
name: macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - ".github/workflows/macos-dmg.yml"
      - "src-tauri/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/stage-macos-dmg.mjs"

permissions:
  contents: write

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"
  CARGO_TERM_COLOR: always

jobs:
  macos-dmg:
    runs-on: macos-latest
    environment: Replayr
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend deps
        run: npm ci

      # Client-safe Vite keys from repo secrets; fail before a long Tauri build if unset.
      - name: Require desktop Vite secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Set repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (same values as local .env)."
            exit 1
          fi

      - name: Build macOS DMG (no Windows bundles)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PUBLIC_APP_URL: https://www.replayr.tv
        run: npm run tauri:build:macos

      - name: Stage DMG for website releases/
        run: npm run installer:stage:macos

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v5
        with:
          name: Replayr-macos-dmg
          path: web/public/releases/Replayr.dmg
          if-no-files-found: error

      - name: Publish macOS download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: macos
          name: Replayr for macOS
          body: Current macOS disk image. The site serves this at https://www.replayr.tv/releases/Replayr.dmg
          files: web/public/releases/Replayr.dmg
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
