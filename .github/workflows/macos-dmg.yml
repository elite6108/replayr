# Build Replayr macOS DMG only. Does not run Windows NSIS builds.
name: macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend deps
        run: npm ci

      - name: Build macOS DMG (no Windows bundles)
        run: npm run tauri:build:macos

      - name: Stage DMG for website releases/
        run: npm run installer:stage:macos

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Replayr-macos-dmg
          path: web/public/releases/Replayr.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: web/public/releases/Replayr.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
