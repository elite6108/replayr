<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          localStorage.setItem("replay.onboardingCompleted", "1");
          localStorage.setItem("replay.theme", "dark");
          localStorage.setItem("replay.recordDockMaxPx", "252");
        } catch (e) {
          /* private mode */
        }
        document.documentElement.dataset.theme = "dark";
        document.documentElement.style.colorScheme = "dark";
        document.documentElement.classList.add("theme-no-motion");
      })();
    </script>
    <style>
      html, body { background: #090b10; color: #f4f7fb; }
      html, body, * { scrollbar-width: none !important; }
      ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Replayr</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
