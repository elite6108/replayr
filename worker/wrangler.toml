name = "replay-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = false

[[routes]]
pattern = "replayr.tv/*"
zone_name = "replayr.tv"

[[routes]]
pattern = "www.replayr.tv/*"
zone_name = "replayr.tv"

[vars]
PUBLIC_APP_URL = "http://127.0.0.1:8787"

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker must run first so the coming-soon cookie gate can hide the SPA.
run_worker_first = true

[triggers]
crons = ["15 * * * *"]

# Local secrets live in .dev.vars (gitignored). Sync from the repo env files:
#   node worker/scripts/sync-dev-vars.mjs
#
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY  (admin API only; never a VITE_ variable)
# R2_ACCOUNT_ID
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY
# R2_BUCKET_NAME
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# STRIPE_PRICE_PREMIUM_MONTHLY
# STRIPE_PRICE_PREMIUM_YEARLY
# Create prices: npm run setup-stripe --prefix worker
# Webhook: https://www.replayr.tv/v1/billing/webhook
# Events: checkout.session.completed, customer.subscription.*, invoice.paid, invoice.payment_failed
#
# Bunny Stream (free-tier branded downloads; never VITE_):
# BUNNY_STREAM_LIBRARY_ID
# BUNNY_STREAM_API_KEY
# BUNNY_STREAM_CDN_HOSTNAME
# BUNNY_STREAM_READONLY_API_KEY  (webhook HMAC; library Read-Only API key)
# BUNNY_STREAM_TOKEN_AUTH_KEY    (optional; CDN token auth)
# Webhook: https://www.replayr.tv/internal/webhooks/bunny
# Ops: enable library watermark PNG + MP4 fallback / single-resolution before ingest
#
# Coming-soon site gate (never VITE_):
# SITE_ACCESS_PASSWORD
