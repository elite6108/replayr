name = "replay-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
workers_dev = false

[[routes]]
pattern = "replayr.tv/*"
zone_name = "replayr.tv"

[[routes]]
pattern = "www.replayr.tv/*"
zone_name = "replayr.tv"

[vars]
PUBLIC_APP_URL = "http://127.0.0.1:8787"

# Required production bindings. Deploy this file with the Worker. A missing binding
# fails closed with 503 before that route signs a URL, writes a row, or calls a provider.
# An exhausted limit returns 429. This file does not prove the live Worker has the
# bindings. After deploy, from worker/, run `npx wrangler deployments status` and
# confirm namespaces 1001-1020 are on the version that is serving.
# ANALYTICS_RATE_LIMITER 1001 — analytics ingest, 60/min
# ANALYTICS_REVEAL_RATE_LIMITER 1002 — admin analytics reveal, 10/min
# SITE_ACCESS_RATE_LIMITER 1003 — coming-soon password, 10/min
# WAITLIST_RATE_LIMITER 1004 — waitlist signup, 10/min
# AI_TRANSCRIBE_RATE_LIMITER 1005 — transcription requests, 4/min
# WRITE_60_RATE_LIMITER 1006 — social and folder mutations, 60/min
# WRITE_30_RATE_LIMITER 1007 — catalog, steam match, observations, screenshot upload, 30/min
# WRITE_20_RATE_LIMITER 1008 — clip game assignment, 20/min
# WRITE_10_RATE_LIMITER 1009 — uploads, avatars, pending games, AI rank, 10/min
# WRITE_5_RATE_LIMITER 1010 — checkout, 5/min
# PLAYBACK_RATE_LIMITER 1011 — clip playback URLs, 120/min
# GAME_SEARCH_RATE_LIMITER 1012 — game search, 30/min
# ACCOUNT_DELETE_RATE_LIMITER 1013 — account deletion, 5/min
# PRESENCE_ANON_RATE_LIMITER 1014 — anonymous presence, 20/min
# PRESENCE_AUTH_RATE_LIMITER 1015 — signed-in presence, 40/min
# PUBLIC_FOLDER_RATE_LIMITER 1016 — public folder page, 60/min
# PUBLIC_FOLDER_PLAY_RATE_LIMITER 1017 — public folder playback URLs, 60/min
# PUBLIC_FOLDER_DOWNLOAD_RATE_LIMITER 1018 — public folder downloads, 20/min
# PUBLIC_MISS_RATE_LIMITER 1019 — clip-embed and screenshot misses, 30/min
# PUBLIC_FEED_RATE_LIMITER 1020 — public clip feed, 120/min

[[ratelimits]]
name = "ANALYTICS_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "ANALYTICS_REVEAL_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "SITE_ACCESS_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "WAITLIST_RATE_LIMITER"
namespace_id = "1004"
# Wrangler only allows a 10s or 60s period, so this is 10 per minute.
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "AI_TRANSCRIBE_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 4, period = 60 }

[[ratelimits]]
name = "WRITE_60_RATE_LIMITER"
namespace_id = "1006"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "WRITE_30_RATE_LIMITER"
namespace_id = "1007"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "WRITE_20_RATE_LIMITER"
namespace_id = "1008"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "WRITE_10_RATE_LIMITER"
namespace_id = "1009"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "WRITE_5_RATE_LIMITER"
namespace_id = "1010"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "PLAYBACK_RATE_LIMITER"
namespace_id = "1011"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "GAME_SEARCH_RATE_LIMITER"
namespace_id = "1012"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "ACCOUNT_DELETE_RATE_LIMITER"
namespace_id = "1013"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "PRESENCE_ANON_RATE_LIMITER"
namespace_id = "1014"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "PRESENCE_AUTH_RATE_LIMITER"
namespace_id = "1015"
simple = { limit = 40, period = 60 }

[[ratelimits]]
name = "PUBLIC_FOLDER_RATE_LIMITER"
namespace_id = "1016"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "PUBLIC_FOLDER_PLAY_RATE_LIMITER"
namespace_id = "1017"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "PUBLIC_FOLDER_DOWNLOAD_RATE_LIMITER"
namespace_id = "1018"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "PUBLIC_MISS_RATE_LIMITER"
namespace_id = "1019"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "PUBLIC_FEED_RATE_LIMITER"
namespace_id = "1020"
simple = { limit = 120, period = 60 }

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Worker must run first so the coming-soon cookie gate can hide the SPA.
run_worker_first = true

[triggers]
crons = ["15 * * * *"]

# Local secrets live in .dev.vars (gitignored). Sync from the repo env files:
#   node worker/scripts/sync-dev-vars.mjs
#
# SUPABASE_URL
# SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY  (admin API only; never a VITE_ variable)
# R2_ACCOUNT_ID
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY
# R2_BUCKET_NAME
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# STRIPE_PRICE_PREMIUM_MONTHLY
# STRIPE_PRICE_PREMIUM_YEARLY
# Create prices: npm run setup-stripe --prefix worker
# Webhook: https://www.replayr.tv/v1/billing/webhook
# Events: checkout.session.completed, customer.subscription.*, invoice.paid, invoice.payment_failed
#
# Bunny Stream (free-tier branded downloads; never VITE_):
# BUNNY_STREAM_LIBRARY_ID
# BUNNY_STREAM_API_KEY
# BUNNY_STREAM_CDN_HOSTNAME
# BUNNY_STREAM_READONLY_API_KEY  (webhook HMAC; library Read-Only API key)
# BUNNY_STREAM_TOKEN_AUTH_KEY    (optional; CDN token auth)
# Webhook: https://www.replayr.tv/internal/webhooks/bunny
# Ops: enable library watermark PNG + MP4 fallback / single-resolution before ingest
#
# Coming-soon site gate (never VITE_):
# SITE_ACCESS_PASSWORD
#
# Expo Push (optional; Worker secret). Enables iOS staff-board notifications:
# EXPO_ACCESS_TOKEN
#
# Transactional email (Resend; API key is a Worker secret):
# RESEND_API_KEY
# RESEND_FROM_EMAIL             (optional; default Replayr <support@replayr.tv>)
# RESEND_REPLY_TO               (optional; default support@replayr.tv)
# OPENAI_API_KEY                (waitlist campaign AI rewrite)
# ANALYTICS_SUBJECT_KEY         (32+ character HMAC secret; never expose to clients)
# ANALYTICS_SUBJECT_PREVIOUS_KEY (optional during key rotation)
# ANALYTICS_SUBJECT_KEY_VERSION (positive integer, defaults to 1)
#
# Mobile Universal / App Links (optional until store builds ship):
# APPLE_TEAM_ID
# IOS_BUNDLE_ID                 (default tv.elite.replay)
# ANDROID_PACKAGE_NAME          (default tv.elite.replay)
# ANDROID_SHA256_CERT_FINGERPRINTS   (comma-separated SHA-256 fingerprints)
